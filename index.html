    <script>
      (function() {
        var isBenignMessage = function(str) {
          if (!str) return false;
          var s = String(str).toLowerCase();
          return (
            s.indexOf("disconnecting idle stream") !== -1 ||
            s.indexOf("timed out waiting for new targets") !== -1 ||
            s.indexOf("grpcconnection rpc 'listen' stream") !== -1 ||
            s.indexOf("websocket") !== -1 ||
            s.indexOf("vite") !== -1 ||
            s.indexOf("hmr") !== -1 ||
            s.indexOf("closed without opened") !== -1 ||
            s.indexOf("connection refused") !== -1
          );
        };

        var suppressErrors = function(event) {
          var error = event.error || (event.reason ? event.reason : null);
          var message = String(event.message || (error && error.message) || error || "");
          var stack = String((error && error.stack) || "");
          if (isBenignMessage(message + " " + stack)) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        };

        window.addEventListener("error", suppressErrors, true);
        window.addEventListener("unhandledrejection", suppressErrors, true);

        // Early console interception to filter benign SDK transport lifecycle notices
        var origConsoleError = console.error;
        console.error = function() {
          var fullText = "";
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (arg instanceof Error) {
              fullText += " " + (arg.stack || arg.message);
            } else if (typeof arg === "object" && arg !== null) {
              try { fullText += " " + JSON.stringify(arg); } catch(e) { fullText += " " + String(arg); }
            } else {
              fullText += " " + String(arg);
            }
          }
          if (isBenignMessage(fullText)) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          var fullText = "";
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (arg instanceof Error) {
              fullText += " " + (arg.stack || arg.message);
            } else {
              fullText += " " + String(arg);
            }
          }
          if (isBenignMessage(fullText)) {
            return;
          }
          origConsoleWarn.apply(console, arguments);
        };
      })();
    </script>
